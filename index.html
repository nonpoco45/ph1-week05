<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学校のトップページ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="bg-blue-300 text-white py-4">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-2">
            <h1 class="text-2xl font-bold text-center text-white">学校のトップページ</h1>
            <nav class="text-center flex flex-col md:flex-row gap-2 md:gap-6 text-sm">
                <a href="#" class="text-blue-700 hover:text-gray-300">ホーム</a>
                <a href="#" class="text-blue-700 hover:text-gray-300">学校紹介</a>
                <a href="#" class="text-blue-700 hover:text-gray-300">入学案内</a>
                <a href="#" class="text-blue-700 hover:text-gray-300">お問い合わせ</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10">
        <section class="mb-8">
        <img src="school.png" alt="学校の外観" class="w-full rounded-lg">
        </section>
        <section class="bg-yellow-200 rounded-lg mb-10 text-center">
            <h2 class="text-3xl font-bold mb-4">ようこそ、私たちの学校へ</h2>
            <p class="text-gray-700">私たちの学校は、学びと成長の場です。<br>ここで最高の仲間と出会いともに切磋琢磨していきましょう。</p>
        </section>

        <section class="mb-10">
            <h2 class="text-center text-xl font-bold mb-4">学校紹介</h2>
            <div class="text-center grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-blue-100 rounded-lg shadow p-4 hover:shadow-lg transition">
                    <p class="text-2xl mb-2">📚</p>
                    <h3 class="text-lg font-bold mb-2">教育理念</h3>
                    <p class="text-gray-700 text-sm">私たちの学校は、個々の才能を最大限に引き出す教育を提供します。</p>
                </div>
                <div class="bg-blue-100 rounded-lg shadow p-4 hover:shadow-lg transition">
                    <p class="text-2xl mb-2">📖</p>
                    <h3 class="text-lg font-bold mb-2">カリキュラム</h3>
                    <p class="text-gray-700 text-sm">幅広い分野の学問を学ぶことができるカリキュラムを用意しています。</p>
                </div>
                <div class="bg-blue-100 rounded-lg shadow p-4 hover:shadow-lg transition">
                    <p class="text-2xl mb-2">🏫</p>
                    <h3 class="text-lg font-bold mb-2">施設紹介</h3>
                    <p class="text-gray-700 text-sm">最新の設備と快適な学習環境を提供する施設をご紹介します。</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-blue-500 text-white text-sm py-6">
        <div class="max-w-4xl mx-auto text-center">
            <p>2027 学校のトップページ.</p>
        </div>
    </footer> 
    
</body>
</html>
